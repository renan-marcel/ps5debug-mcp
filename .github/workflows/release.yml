name: Auto Tag & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional explicit tag (leave empty for automatic semver)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v

      - name: Compute and push semver tag
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          MANUAL_TAG="${{ inputs.tag }}"
          EXISTING_AT_HEAD=$(git tag --points-at HEAD "v*" | head -n1)

          if [ -n "$MANUAL_TAG" ]; then
            NEW_TAG="$MANUAL_TAG"
          elif [ -n "$EXISTING_AT_HEAD" ]; then
            echo "HEAD already tagged as $EXISTING_AT_HEAD; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "")
            if [ -z "$LATEST_TAG" ]; then
              NEW_TAG="v0.1.0"
            else
              VER="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
              LOG=$(git log "${LATEST_TAG}..HEAD" --format="%s%n%b")
              if echo "$LOG" | grep -qE "(BREAKING CHANGE:|^[a-z]+(\([^)]+\))?!:)"; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
              elif echo "$LOG" | grep -qE "^feat(\([^)]+\))?:"; then
                MINOR=$((MINOR + 1))
                PATCH=0
              else
                PATCH=$((PATCH + 1))
              fi
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          if ! git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
            git push origin "$NEW_TAG"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Computed tag: $NEW_TAG"

      - name: Build distributions
        if: steps.tag.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Create GitHub Release
        if: steps.tag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "ps5debug-mcp ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
